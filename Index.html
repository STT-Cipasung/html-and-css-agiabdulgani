<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Project</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        p {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <p style="color: red;">This is a paragraph example 1</p>
    <p>This is a paragraph example 2</p>
    <p>This is a paragraph example 3</p>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="background-color: red;">Left</div>
        <div style="background-color: green;">Center</div>
        <div style="background-color: blue;">Right</div>
    </div>
</body>
</html>
